{% extends 'catalog/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-black border border-zinc-800 p-8 text-center">
    <h2 class="text-xl font-extrabold uppercase tracking-widest text-red-500 mb-2">Eliminar Producto</h2>
    <p class="text-zinc-400 text-sm mb-6">¿Estás seguro de que deseas eliminar permanentemente <strong>"{{ product.name }}"</strong>?</p>

    <form method="post" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% url 'product_list' %}" class="border border-zinc-700 text-white px-6 py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-zinc-800 transition">
            Cancelar
        </a>
        <button type="submit" class="bg-red-600 text-white px-6 py-2.5 text-xs font-bold uppercase tracking-wider hover:bg-red-700 transition">
            Eliminar
        </button>
    </form>
</div>
{% endblock %}
