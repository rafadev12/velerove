{% extends 'catalog/base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-16 bg-black border border-zinc-900 p-8 rounded-sm shadow-2xl">
    <div class="text-center mb-8">
        <h2 class="text-2xl font-black uppercase tracking-widest text-white">Acceso Admin</h2>
        <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Gestión Interna VELERO Store</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="p-3 bg-red-950/50 border border-red-800 text-red-400 text-xs font-mono">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-zinc-400 mb-2">Usuario</label>
            <input type="text" name="username" class="w-full bg-zinc-950 border border-zinc-800 text-white p-3 text-xs focus:outline-none focus:border-white transition" required>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-zinc-400 mb-2">Contraseña</label>
            <input type="password" name="password" class="w-full bg-zinc-950 border border-zinc-800 text-white p-3 text-xs focus:outline-none focus:border-white transition" required>
        </div>

        <button type="submit" class="w-full bg-white text-black py-3.5 text-xs font-bold uppercase tracking-[0.2em] hover:bg-zinc-200 transition">
            Iniciar Sesión
        </button>
    </form>
</div>
{% endblock %}
